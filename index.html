<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Reproductor Anime/Serie</title>
    <style>
        body { background-color: #000; color: #fff; font-family: sans-serif; margin: 0; padding: 15px; text-align: center; }
        .contenedor-video { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; background: #111; border-radius: 8px; margin-bottom: 15px; }
        .contenedor-video iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        .buscador { width: 95%; padding: 12px; margin-bottom: 15px; border-radius: 5px; border: 1px solid #333; background: #222; color: #fff; font-size: 16px; }
        .lista-capitulos { max-height: 250px; overflow-y: auto; border: 1px solid #222; border-radius: 8px; background: #111; padding: 5px; }
        .boton-capitulo { display: block; width: 100%; padding: 12px; margin: 4px 0; background: #1c1c1c; color: #fff; border: 1px solid #333; border-radius: 5px; text-align: left; cursor: pointer; font-size: 14px; }
        .boton-capitulo:hover { background: #333; }
    </style>
</head>
<body>

    <!-- El reproductor inicia completamente en blanco y quieto -->
    <div class="contenedor-video">
        <iframe id="reproductor" src="about:blank" allowfullscreen></iframe>
    </div>

    <!-- Buscador para pantallas móviles -->
    <input type="text" id="buscarInput" class="buscador" onkeyup="filtrarCapitulos()" placeholder="Buscar capítulo por nombre o número...">

    <!-- Lista de Capítulos (Usa los nombres exactos de tu archivo de Archive.org) -->
    <div class="lista-capitulos" id="lista">
        <button class="boton-capitulo" onclick="cargarVideo('T1-001. Hogar dulce hogar [480p].mp4')">T1-001. Hogar dulce hogar</button>
        <button class="boton-capitulo" onclick="cargarVideo('T1-002. Supergía [480p].mp4')">T1-002. Supergía</button>
        <button class="boton-capitulo" onclick="cargarVideo('T1-006. Bardo en lo de Dardo [480p].mp4')">T1-006. Bardo en lo de Dardo</button>
        <!-- Puedes seguir duplicando estas líneas y cambiar el nombre del archivo .mp4 -->
    </div>

    <script>
        function cargarVideo(archivo) {
            // El identificador exacto de tu carpeta contenedora
            var idColeccion = "casados-con-hijos-2005-480p";
            var urlCompleta = "https://archive.org" + idColeccion + "/" + encodeURIComponent(archivo);
            document.getElementById('reproductor').src = urlCompleta;
        }

        function filtrarCapitulos() {
            var input = document.getElementById('buscarInput').value.toLowerCase();
            var botones = document.getElementById('lista').getElementsByClassName('boton-capitulo');
            for (var i = 0; i < botones.length; i++) {
                var texto = botones[i].innerText.toLowerCase();
                botones[i].style.display = texto.includes(input) ? "block" : "none";
            }
        }
    </script>

</body>
</html>
